name: ci

on:
  push:
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ lcov clang-format \
            make autoconf automake libtool pkg-config curl unzip gh \
            libintelrdfpmath-dev

      - name: Check formatting
        run: |
          chmod +x scripts/check_clang_format.sh
          ./scripts/check_clang_format.sh

      - name: Restore or rebuild Linux dependency bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dependencies/linux
          if gh release download linux-deps -p 'linux-deps-ubuntu-latest.tar.gz' -D dependencies/linux; then
            echo "Using prebuilt linux-deps release asset"
          else
            echo "linux-deps release asset not found; rebuilding dependencies"
            chmod +x scripts/rebuild_linux_deps_ci.sh
            ./scripts/rebuild_linux_deps_ci.sh
            gh release view linux-deps >/dev/null 2>&1 || gh release create linux-deps --title "linux-deps" --notes "Latest reusable Linux dependency bundle for CI."
            gh release upload linux-deps dependencies/linux/linux-deps-ubuntu-latest.tar.gz --clobber
          fi
          tar -xzf dependencies/linux/linux-deps-ubuntu-latest.tar.gz -C .
          test -d dependencies/linux/install

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/dependencies/linux/install"

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Package Linux binaries
        run: |
          mkdir -p artifacts/linux-bin
          cp build/hft_app artifacts/linux-bin/
          cp build/ibkr_paper_order_probe artifacts/linux-bin/
          cp build/hft_tests artifacts/linux-bin/
          cp build/hft_gtests artifacts/linux-bin/
          tar -czf artifacts/trading-system-linux-bin.tar.gz -C artifacts/linux-bin .

      - name: Upload Linux binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-system-linux-bin
          path: artifacts/trading-system-linux-bin.tar.gz

      # Publish the engine binary as a self-contained container image to
      # GitHub Packages (ghcr.io), tagged by branch and branch-sha. The
      # image bundles hft_app + its vendored .so deps so it never depends
      # on host library paths. Only on pushes to the tracked branches.
      - name: Publish hft_app image to ghcr
        if: >-
          github.event_name == 'push' &&
          (github.ref_name == 'main' ||
           github.ref_name == 'chronos2-mr-pred-exit')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p image/lib
          cp build/hft_app image/hft_app
          cp -a dependencies/linux/install/lib/*.so* image/lib/ 2>/dev/null || true
          cp docker/hft_app.Dockerfile image/Dockerfile
          IMG="ghcr.io/${{ github.repository }}/hft_app"
          SHA="$(git rev-parse --short HEAD)"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMG:${{ github.ref_name }}" \
                       -t "$IMG:${{ github.ref_name }}-$SHA" image/
          docker push "$IMG:${{ github.ref_name }}"
          docker push "$IMG:${{ github.ref_name }}-$SHA"
          echo "Published $IMG:${{ github.ref_name }} and :${{ github.ref_name }}-$SHA"

      - name: Test
        run: |
          cd build
          ctest --output-on-failure

      - name: Smoke app
        run: |
          chmod +x scripts/smoke_app_ci.sh
          ./scripts/smoke_app_ci.sh build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ lcov clang-format \
            make autoconf automake libtool pkg-config curl unzip gh \
            libintelrdfpmath-dev python3

      - name: Restore or rebuild Linux dependency bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dependencies/linux
          if gh release download linux-deps -p 'linux-deps-ubuntu-latest.tar.gz' -D dependencies/linux; then
            echo "Using prebuilt linux-deps release asset"
          else
            echo "linux-deps release asset not found; rebuilding dependencies"
            chmod +x scripts/rebuild_linux_deps_ci.sh
            ./scripts/rebuild_linux_deps_ci.sh
            gh release view linux-deps >/dev/null 2>&1 || gh release create linux-deps --title "linux-deps" --notes "Latest reusable Linux dependency bundle for CI."
            gh release upload linux-deps dependencies/linux/linux-deps-ubuntu-latest.tar.gz --clobber
          fi
          tar -xzf dependencies/linux/linux-deps-ubuntu-latest.tar.gz -C .
          test -d dependencies/linux/install

      - name: Run coverage
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/dependencies/linux/install
        run: |
          chmod +x scripts/run_coverage_ci.sh
          python3 --version
          ./scripts/run_coverage_ci.sh

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage-html

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: build-coverage/coverage.filtered.info

  linux-deps-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '%REBUILD_DEPS')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git curl tar gh libintelrdfpmath-dev

      - name: Build Linux dependency bundle
        run: |
          chmod +x scripts/rebuild_linux_deps_ci.sh
          ./scripts/rebuild_linux_deps_ci.sh

      - name: Upload Linux dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deps-ubuntu-latest
          path: dependencies/linux/linux-deps-ubuntu-latest.tar.gz

      - name: Create or update linux-deps release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view linux-deps >/dev/null 2>&1 || gh release create linux-deps --title "linux-deps" --notes "Latest reusable Linux dependency bundle for CI."
          gh release upload linux-deps dependencies/linux/linux-deps-ubuntu-latest.tar.gz --clobber
