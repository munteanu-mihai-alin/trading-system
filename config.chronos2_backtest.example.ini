[runtime]
# Chronos2-MR-PredExit is portfolio-driven, not tick-driven. Universe
# is the yen-window 49 symbols (config/symbols_yen.txt supplies the
# equivalent list). Steps here are engine ticks, not trading days --
# ~1.7M steps/day for MBP-1 replay, so ~12M for a 7-day backtest.
universe_size=49
top_k=3
steps=12000000
symbol_universe_path=config/symbols_yen.txt

[strategy]
# Fork the routing entirely: main.cpp constructs Chronos2ExecutionEngine
# instead of LiveExecutionEngine when this is set.
strategy_mode=chronos2_mr_pred_exit

[broker]
mode=databento_backtest
host=127.0.0.1
paper_port=0
live_port=0
client_id=1

[execution]
order_enabled=true
trade_notional=500
account_budget=1500
# Chronos2 does not use OU or Hawkes; leave the shadow / synthetic-fill
# knobs off. steps_auto_from_broker is not wired for this strategy yet.
shadow_enabled=false
synthetic_fill_model=false
entry_limit_mode=ask
steps_auto_from_broker=false
max_orders_per_run=0
max_orders_per_symbol=0
order_qty=0
max_order_qty=0
max_notional_per_order=0

[sell_strategy]
# Also serves as the entry-side minimum forecast: Chronos2 only enters
# if predicted_return >= target_profit_pct. On exit, the actual sell
# limit is max(predicted_price, entry * (1 + target_profit_pct)) --
# never sells at a loss even if the forecast turned negative.
target_profit_pct=0.025
# min_sell_execution_score has no effect in the Chronos2 engine; the
# exit is unconditional once route_exit_orders picks up the position.
min_sell_execution_score=0

[chronos2]
# The Python side is spawned once per trading day and asked to write
# per-symbol predictions. Same one-shot pattern as the Databento
# downloader. Chronos-2 weights are downloaded from HuggingFace on
# first run and cached.
chronos2_python=./.venv/bin/python
chronos2_forecast_script=scripts/chronos2_forecast.py
chronos2_predictions_dir=data/chronos2/predictions
chronos2_daily_closes_dir=data/chronos2/daily_closes
chronos2_model=amazon/chronos-2
# Trading-day context handed to the model. 64 daily closes is the same
# window the Python QC variant uses.
chronos2_context_len=64
chronos2_prediction_len=1
# Filter: skip any symbol whose 20-day annualised realised vol exceeds
# this. Avoids crashy names (NIO, OKLO during their spikes).
chronos2_max_annual_vol=0.80
chronos2_vol_lookback_days=20
chronos2_momentum_lookback_days=5
# Denominator floor for the Sharpe-like composite:
#   score = predicted_return / max(realised_vol, chronos2_vol_floor)
chronos2_vol_floor=0.05
# Reinvest schedule. Every $500 of realised profit unlocks one extra
# slot: bonus_budget grows by 500 and effective top_k grows by 1.
chronos2_reinvest_increment=500

[costs]
commission_per_share=0.0035
commission_min_per_order=0.35
half_spread_cost=0.0005
impact_coefficient=0.1
assumed_daily_volume=1000000
daily_energy_kwh=0
energy_cost_per_kwh=0
daily_inflation_cost=0.15
expected_daily_shares=1

[databento]
databento_cache_dir=data/l2
databento_python=./.venv/bin/python
databento_l1_download_script=scripts/local_l1_csv_provider.py
databento_l2_download_script=scripts/databento_download_l2.py
databento_l1_dataset=data/l1
databento_l2_dataset=XNAS.ITCH
databento_l1_schema=mbp-1
databento_l2_schema=mbp-10
databento_start=2024-08-02T13:30:00Z
databento_end=2024-08-09T20:00:00Z
