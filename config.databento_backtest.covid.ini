[runtime]
# COVID-acute adversarial backtest universe is the default 50 symbols
# minus 5 that did not trade publicly in March 2020 (ARM, OKLO, SNDK,
# XPEV, HWM - see config/symbols_covid.txt for IPO dates). Net: 45.
universe_size=45
top_k=3
# steps drives the engine.step(t) loop count; steps_auto_from_broker
# below caps this to the L1 series length, so the explicit value here
# is just an upper bound that the engine never reaches.
steps=8500000
# Symbol universe file overrides the hard-coded kSymbolCompanyList in
# symbol_universe.hpp. Loaded via load_symbol_universe_from_file.
symbol_universe_path=config/symbols_covid.txt

[backtest_logging]
# Per-run artifacts land here and get moved into
# reports/runs/<run_id>/ by scripts/organize_runs.py post-run.
decision_log_path=reports/decisions.csv
order_log_path=reports/orders.csv
step_trace_log_path=reports/step_trace.csv
# Capture 10 step snapshots before AND after each buy/sell event,
# discard the rest. Required for Databento MBP-1 L1 - see the yen
# config for the rationale and [2026-05-29] handoff entry for
# the disk-full crash that motivated this knob.
step_trace_context_window=10
l2_trace_log_path=reports/l2_trace.csv
log_append_mode=false
run_label=cpp_backtest_covid_acute

[broker]
mode=databento_backtest
host=127.0.0.1
paper_port=0
live_port=0
client_id=1

[execution]
order_enabled=true
trade_notional=500
account_budget=1500
position_sizing_rule=equal
max_open_symbols=3
shadow_enabled=false
synthetic_fill_model=false
entry_limit_mode=ask
steps_auto_from_broker=true
hawkes_mid_change_threshold_bps=2.5
# Uncapped order counts so all trades within the window fire.
# Run #6 confirmed these settings hold up on 10 days.
max_orders_per_run=0
max_orders_per_symbol=0
order_qty=0
max_order_qty=0
max_notional_per_order=0

[entry_strategy]
ou_halflife_seconds=1800
ou_window_size=0
ou_buy_threshold_pct=0.0
hawkes_use_real_trades=false
hit_count_enabled=false
hit_count_target_pct=0.008
hit_count_horizon_seconds=60
hit_count_baseline=5
hit_count_tilt_min=1.0
hit_count_tilt_max=3.0

[sell_strategy]
target_profit_pct=0.008
min_sell_execution_score=0

[costs]
# IBKR Pro Tiered defaults (calibrated 2026-05-24).
commission_per_share=0.0035
commission_min_per_order=0.35
half_spread_cost=0.0005
impact_coefficient=0.1
assumed_daily_volume=1000000
daily_energy_kwh=0
energy_cost_per_kwh=0
# $0.15/day opportunity-cost drag on $1500 budget (~3.7% annualised).
# Adversarial window is ~14 days -> ~$2 of opportunity cost subtracted
# in net_pnl_after_opportunity_cost.
daily_inflation_cost=0.15
expected_daily_shares=1

[databento]
# Per-window dated layout. Broker globs <root>/**/<SYMBOL>_<startISO>_<endISO>.mbpN.csv
# to find any covering file; otherwise downloads gaps into the dated layout.
# COVID window has NO existing cache anywhere on disk, so the first run
# pays full Databento spend (~$20-40 estimated, only for symbols actually
# held by the strategy).
databento_cache_dir=data/l2
# Hetzner default - the venv's python has databento + numpy installed.
# Local Linux/Mac users may want plain "python3"; on Windows local you'd
# need an absolute path.
databento_python=./.venv/bin/python
databento_l1_download_script=scripts/local_l1_csv_provider.py
databento_l2_download_script=scripts/databento_download_l2.py
databento_l1_dataset=data/l1
databento_l2_dataset=XNAS.ITCH
databento_l1_schema=mbp-1
databento_l2_schema=mbp-10
# COVID acute window: Mon Mar 9, 2020 (SPX -7.6%, circuit breaker) through
# Fri Mar 20, 2020 (close). 10 trading days. EDT (UTC-4).
databento_start=2020-03-09T13:30:00Z
databento_end=2020-03-20T20:00:00Z
